<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    


    <div class="container">
        <h1>Parkinson Disease Prediction Application</h1>
        <p>This is a nervous system disorder disease with symptoms like loss of walking, talking etc.,</p>


                <form action="/predict" method="post">
                <fieldset >
                    <legend>Add Input Features</legend>
                    <div class="mb-3">
                    <label for="disabledTextInput" class="form-label"> input</label>
                    <input type="text" id="disabledTextInput" name="text" class="form-control" placeholder=" input">
                    </div>
                
                    <button type="submit" class="btn btn-primary">Submit</button>
                </fieldset>

                {% if output %}
                <p>{{output}} </p>
                {% endif %}
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
