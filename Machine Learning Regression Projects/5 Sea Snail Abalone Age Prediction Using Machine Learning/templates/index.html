<div class="container my-3 mt-3" style="background:darkslategray;">
    <h1 class="text-center">Sea Snail Abalone Age Prediction</h1>
    <img src="{{ url_for('static', filename='img.jpg')}}" width="200"  height="200">


    <form action="/predict" method="post">
        <div class="row">
            <div class="form-group col-md-4">
                <label for="Sex"  class="text-white">Sex</label>
                <select name="sex" id="sex" class="form-control">
                    <option value="0">Male</option>
                    <option value="1">Female</option>
                    <option value="2">Infant</option>
                </select>
            </div>
            <div class="form-group col-md-4">
                <label for="length"  class="text-white">Length</label>
                <input type="number" id="len" name="len" step="0.01" value="0" class="form-control">
            </div>
            <div class="form-group col-md-4">
                <label for="diameter" class="text-white">Diameter</label>
                <input type="number" id="dim" name="dim" step="0.01" value="0"  class="form-control">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-4">
                <label for="height"  class="text-white">Height</label>
                <input type="number" class="form-control" id="ht" name="ht" step="00.01" value="0">
            </div>
            <div class="form-group col-md-4">
                <label for="whoelweight"  class="text-white">Whole Weight</label>
                <input type="number" id="whw" name="whw" step="0.01" value="0" class="form-control">
            </div>
            <div class="form-group col-md-4">
                <label for="shuckedweight" class="text-white">Shucked weight</label>
                <input type="number" id="sw" name="sw" step="0.01" value="0"  class="form-control">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-4">
                <label for="visceraweight" class="text-white">Viscera weight</label>
                <input type="number" id="vw" name="vw" step="0.01" value="0"  class="form-control">
            </div>
            <div class="form-group col-md-4">
                <label for="shellweight" class="text-white">Shell weight</label>
                <input type="number" id="shw" name="shw" step="0.01" value="0"  class="form-control">
            </div>
        </div>

        <button type="submit" class="btn btn-warning btn-lg" style="margin-top: 10px;">Predict</button>

        {% if age %}
        <p>Predicted age: {{age}}</p>
        {% endif %}
    </form>
</div>
