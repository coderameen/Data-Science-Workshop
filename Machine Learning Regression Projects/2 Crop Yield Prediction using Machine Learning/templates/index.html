<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="text-center text-success">Global Crop Yield Prediction using ML</h1>

    <div class="container mt-4 my-4" style="background:black;color:white;border-radius: 20px;">
        <h1 class="text-success text-center">Crop Feature Here</h1>
        <form action="/predict" method="post">
    <div class="form-group">
        <label for="Year">Year</label>
        <input type="number" class="form-control" name="Year" step="any">
    </div>
        <div class="form-group">
        <label for="average_rain_fall_mm_per_year">average_rain_fall_mm_per_year</label>
        <input type="number" class="form-control" name="average_rain_fall_mm_per_year" step="any">
    </div>
    
    <div class="form-group">
        <label for="pesticides_tonnes">pesticides_tonnes</label>
        <input type="number" class="form-control" name="pesticides_tonnes" step="any">
    </div>
    <div class="form-group">
        <label for="avg_temp">avg_temp</label>
        <input type="number" class="form-control" name="avg_temp" step="any">
    </div>
        <div class="form-group">
        <label for="Area">Area</label>
        <input type="text" class="form-control" name="Area" step="any">
    </div>
   
        <div class="form-group">
        <label for="Item">Item</label>
        <input type="text" class="form-control" name="Item" step="any">
    </div>
  
    <button type="submit" class="btn btn-success btn-lg" style="margin-top: 10px;margin-left:550px">Prediction</button>
       </div>
        </form>

        {% if output %}
        <h1 class="text-center text-danger"> Predicted Yield prediction: {{output}}</h1>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
